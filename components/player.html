<!-- ==================================================
     QFR PERSISTENT PLAYER
================================================== -->

<div id="qfr-player">

    <div class="player-left">

        <img
            id="player-artwork"
            src="assets/images/placeholders/default-cover.jpg"
            alt="Album Artwork">

        <div>

            <h4 id="player-title">

                Nothing Playing

            </h4>

            <p id="player-artist">

                Quantum Frequency Records

            </p>

        </div>

    </div>

    <div class="player-center">

        <button id="previous-track">

            <i class="fa-solid fa-backward-step"></i>

        </button>

        <button id="play-pause">

            <i class="fa-solid fa-play"></i>

        </button>

        <button id="next-track">

            <i class="fa-solid fa-forward-step"></i>

        </button>

    </div>

    <div class="player-right">

        <div id="player-waveform"></div>

        <input

            type="range"

            min="0"

            max="100"

            value="80"

            id="volume">

    </div>

</div>
