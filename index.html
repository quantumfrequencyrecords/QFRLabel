<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#020207">

    <title>Quantum Frequency Records</title>

    <meta
        name="description"
        content="Quantum Frequency Records — Unleash Music's Raw Vibrational Energy."
    >

    <meta
        property="og:title"
        content="Quantum Frequency Records"
    >

    <meta
        property="og:description"
        content="Unleash Music's Raw Vibrational Energy"
    >

    <meta
        property="og:type"
        content="website"
    >

    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <!-- Global stylesheet -->

    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >

    <!-- Landing-page-only stylesheet -->

    <link
        rel="stylesheet"
        href="assets/css/landing.css"
    >

</head>


<body class="qfr-landing">


    <!-- =====================================================
         BACKGROUND SYSTEM
    ====================================================== -->

    <div
        id="background-gradient"
        aria-hidden="true">
    </div>


    <div
        id="particles-js"
        aria-hidden="true">
    </div>


    <div
        id="ambient-glow"
        aria-hidden="true">
    </div>


    <div
        id="background-noise"
        aria-hidden="true">
    </div>


    <!-- =====================================================
         QFR LOGO BACKGROUND
    ====================================================== -->

    <section
        id="logo-section"
        aria-hidden="true">

        <img
            id="qfr-logo"
            src="assets/logos/qfr-logo.png"
            alt=""
        >

    </section>


    <!-- =====================================================
         MAIN LANDING PAGE
    ====================================================== -->

    <main id="landing-page">

        <section id="hero">

            <div class="hero-content">


                <!-- =================================================
                     MAIN HEADLINE
                ================================================== -->

                <h1>

                    Unleash Music's

                    <br>

                    <span>
                        Raw Vibrational Energy
                    </span>

                </h1>


                <!-- =================================================
                     ANIMATED SUBTITLE

                     Only the four words are animated.
                     Separators remain stationary.
                ================================================== -->

                <div
                    id="animated-subtitle"
                    aria-label="Discover, Harness, Nurture, Succeed">

                    <span class="subtitle-word">
                        Discover
                    </span>

                    <span
                        class="subtitle-separator"
                        aria-hidden="true">
                        •
                    </span>

                    <span class="subtitle-word">
                        Harness
                    </span>

                    <span
                        class="subtitle-separator"
                        aria-hidden="true">
                        •
                    </span>

                    <span class="subtitle-word">
                        Nurture
                    </span>

                    <span
                        class="subtitle-separator"
                        aria-hidden="true">
                        •
                    </span>

                    <span class="subtitle-word">
                        Succeed
                    </span>

                </div>


                <!-- =================================================
                     ENTER BUTTON
                ================================================== -->

                <a
                    id="explore-button"
                    href="home.html">

                    <span>
                        Enter the Experience
                    </span>

                </a>


            </div>

        </section>


    </main>


    <!-- =====================================================
         LOADING SCREEN
    ====================================================== -->

    <div
        id="page-loader"
        aria-hidden="true">

        <div class="loader-container">

            <div class="loader-ring"></div>

            <div class="loader-core"></div>

            <div class="loader-text">
                Quantum Frequency Records
            </div>

        </div>

    </div>


    <!-- =====================================================
         ACCESSIBILITY
    ====================================================== -->

    <a
        class="skip-link"
        href="#hero">

        Skip to main content

    </a>


    <!-- =====================================================
         JAVASCRIPT LIBRARIES
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/tsparticles@3/tsparticles.bundle.min.js">
    </script>


    <!-- =====================================================
         QFR JAVASCRIPT
    ====================================================== -->

    <script src="assets/js/main.js"></script>

    <script src="assets/js/particles.js"></script>

    <script src="assets/js/loader.js"></script>


</body>

</html>
